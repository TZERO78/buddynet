# Demo overlay: friendly buddy names for the ASCII demo (lab/demo.sh).
# Overrides only NODE_NAME on the party buddies, so BuddyDNS announces
# bob/alice/steven/markus/sandra instead of beta/gamma/delta/epsilon/zeta.
# Usage: ./demo.sh (it applies this overlay, clears the hub name cache, plays).
services:
  party-beta:
    environment:
      NODE_NAME: bob
  party-gamma:
    environment:
      NODE_NAME: alice
  party-delta:
    environment:
      NODE_NAME: steven
  party-epsilon:
    environment:
      NODE_NAME: markus
  party-zeta:
    environment:
      NODE_NAME: sandra

  # The demo's `peers remove`/`add` rewrite the manifest, and they do it
  # ATOMICALLY: write a temp file next to it, then rename over the original. A
  # read-write bind mount of the FILE is not enough for that — the rename fails
  # with "device or resource busy", the tombstone is already written and the demo
  # shows an error where it means to show a revocation. Mount the DIRECTORY so
  # the rename has somewhere to land, and point --peers-file inside it.
  party-hub:
    command:
      - --role=buddy
      - --key=/var/lib/buddynet/id.key
      - --peers-file=/party/hub.peers
      - --known-peers=/var/lib/buddynet/known_peers
      - --vip-listen=8080
      - --no-interactive
      - --name=hub
      - --dns
      - --idle-timeout=10m
    volumes:
      - party-hub-key:/var/lib/buddynet
      - ./party:/party
