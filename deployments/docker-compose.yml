# BuddyNet server side on a VPS: the handshake (matchmaking) server plus an
# optional relay for buddies that cannot punch a direct path.
#
#   cp deployments/.env.example deployments/.env   # then edit ports if needed
#
#   # 1. Create the server identity ONCE. The server never creates its own key:
#   #    that way a lost volume refuses to start instead of quietly coming up as a
#   #    DIFFERENT server that every buddy rejects as a possible MITM.
#   docker compose -f deployments/docker-compose.yml run --rm \
#       handshake --role=handshake --key /var/lib/buddynet/id.key init
#       # ^ prints the SERVER_KEY your buddies pin with --server-key. Back the
#       #   volume up; losing it means every buddy has to re-pin.
#
#   # 2. Then start it:
#   docker compose -f deployments/docker-compose.yml up -d --build
#
#   # Print the key again later (read-only):
#   docker compose -f deployments/docker-compose.yml run --rm \
#       handshake --role=handshake --key /var/lib/buddynet/id.key identity
#
# Ports are picked once via .env (BUDDYNET_HANDSHAKE_PORT / BUDDYNET_RELAY_PORT);
# unset, they fall back to the documented defaults 51820 / 51821. The relay is a
# separate service on its own port; it forwards encrypted QUIC packets blindly
# and never sees content. Advertise it to buddies by adding
#   --relay-endpoint your.vps.example:${BUDDYNET_RELAY_PORT}
# to the handshake command below.
services:
  handshake:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: ghcr.io/tzero78/buddynet:v5.0.0   # locally built by the handshake service; bump per release
    command:
      - --role=handshake
      - --listen
      - "[::]:${BUDDYNET_HANDSHAKE_PORT:-51820}"
      - --key
      - /var/lib/buddynet/id.key
      # approval mode: also pass  --authorized /var/lib/buddynet/clients.txt
      # advertise the relay:       --relay-endpoint your.vps.example:${BUDDYNET_RELAY_PORT:-51821}
      # Issue relay tickets for it (same id as the relay service below):
      - --relay-id
      - "${BUDDYNET_RELAY_ID:?set BUDDYNET_RELAY_ID (buddynet gen-relay-id) in .env}"
    ports:
      - "${BUDDYNET_HANDSHAKE_PORT:-51820}:${BUDDYNET_HANDSHAKE_PORT:-51820}/udp"
    volumes:
      - buddynet:/var/lib/buddynet   # persistent identity key (and allowlist)
    restart: unless-stopped
    # Bound the log: the roles log per-event, and an abuse burst must not be able
    # to fill the host disk. The systemd units carry LogRateLimit for the same
    # reason; compose needs it stated explicitly.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # --- container hardening -------------------------------------------------
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  relay:
    image: ghcr.io/tzero78/buddynet:v5.0.0   # locally built by the handshake service; bump per release
    command:
      - --role=relay
      - --listen
      - "[::]:${BUDDYNET_RELAY_PORT:-51821}"
      # AUTHORIZATION POLICY — REQUIRED, the relay refuses to start without one.
      # BUDDYNET_SERVER_KEY is what `buddynet --key ... identity` printed for the
      # handshake service above; BUDDYNET_RELAY_ID is `buddynet gen-relay-id`, run
      # ONCE and set identically on both services.
      - --server-key
      - "${BUDDYNET_SERVER_KEY:?set BUDDYNET_SERVER_KEY (the handshake identity) in .env}"
      - --relay-id
      - "${BUDDYNET_RELAY_ID:?set BUDDYNET_RELAY_ID (buddynet gen-relay-id) in .env}"
    ports:
      - "${BUDDYNET_RELAY_PORT:-51821}:${BUDDYNET_RELAY_PORT:-51821}/udp"
    restart: unless-stopped
    # Bound the log: the roles log per-event, and an abuse burst must not be able
    # to fill the host disk. The systemd units carry LogRateLimit for the same
    # reason; compose needs it stated explicitly.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    # --- container hardening -------------------------------------------------
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  buddynet:
