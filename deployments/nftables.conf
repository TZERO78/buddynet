#!/usr/sbin/nft -f
#
# BuddyNet VPS firewall (nftables): default-drop, with only SSH and the two
# BuddyNet UDP ports open. The HANDSHAKE port is rate-limited to blunt floods;
# the RELAY port deliberately is not, because it carries tunnel data (see the
# comment at that rule). The server's in-process caps and the container's
# MemoryMax/TasksMax bound the process, but only the firewall protects the
# kernel UDP stack and your bandwidth. Adjust the two ports below to match your
# --listen settings.
#
#   sudo install -m 0644 deployments/nftables.conf /etc/nftables.d/buddynet.conf
#   sudo nft -f /etc/nftables.d/buddynet.conf
#   # or include it from /etc/nftables.conf
#
# WARNING: this sets the input policy to drop. SSH (22) is explicitly allowed
# below so you are not locked out; change it if your SSH runs elsewhere.

# --- ports (keep in sync with --listen / --relay-listen) ---------------------
define port_handshake = 51820
define port_relay     = 51821
define port_ssh       = 22

table inet buddynet {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state invalid drop

        # BuddyNet's UDP ports are handled BEFORE the generic established/related
        # accept. Netfilter treats a UDP flow as established once it has seen
        # traffic in both directions, so as soon as the server answers the first
        # packet — a QUIC Initial, a relay cookie challenge — every later packet of
        # that 5-tuple matched the accept above and the limit below was never
        # reached. And QUIC multiplexes many connections over one UDP flow, so
        # conntrack is not a per-connection quota either. The limit has to come
        # first, and the excess has to be dropped explicitly: without the drop,
        # over-limit packets simply fall through to the established accept.
        # Two limits, in this order, because they defend different things.
        #
        #  1. A GLOBAL ceiling. This is the one that protects the box: whatever
        #     the sources, the handshake port never costs more than this much
        #     kernel and TLS work. Set well above any legitimate load — it is an
        #     emergency brake, not a shaping rule.
        #  2. PER-SOURCE fairness. A `limit` is attached to the RULE, so a single
        #     loud source can spend the whole global budget and crowd everybody
        #     else out. Measured, not assumed: with only the global limit,
        #     lab/test-firewall-fairness.sh saw a legitimate buddy keep 15% of
        #     its packets next to one flooding source. A per-source meter gives
        #     every address its own bucket, so the flood starves itself and not
        #     your buddies. IPv6 is keyed by /64, the way the server's own
        #     accounting is: a single host gets far more than one address.
        #
        # A packet must survive both to be accepted, and PER-SOURCE COMES FIRST.
        # That order is load-bearing, the same way the position of the
        # established/related accept is. A global limit is source-blind: put it
        # first and it drops a share of everybody's packets, including the buddy
        # you are trying to protect. Put the per-source meter first and the
        # global ceiling only ever sees traffic that has already been tamed, so
        # it stays what it is meant to be — an emergency brake for MANY sources,
        # not a tax one flooder makes everybody else pay.
        # Measured with lab/test-firewall-fairness.sh (one flooding source, one
        # legitimate buddy, counted against the buddy's unopposed throughput):
        #   global limit only .................. buddy keeps  15%
        #   global first, then per-source ...... buddy keeps  77%
        #   per-source first, then global ...... buddy keeps 100%
        udp dport $port_handshake meter bn-hs4 size 65535 \
            { ip  saddr timeout 60s limit rate over 50/second burst 50 packets } drop
        udp dport $port_handshake meter bn-hs6 size 65535 \
            { ip6 saddr and ffff:ffff:ffff:ffff:: timeout 60s limit rate over 50/second burst 50 packets } drop
        udp dport $port_handshake limit rate over 500/second burst 200 packets drop
        udp dport $port_handshake accept

        # The relay port deliberately has NO packet-rate limit here: it carries
        # tunnel DATA, so a rate that is safe for a control plane would throttle the
        # tunnel itself. Its abuse ceilings live in the relay (per-source bind rate
        # limit, legs per source, session cap), and bandwidth is a shaping/provider
        # problem — tc, an nftables meter sized for your link, or an egress budget —
        # not something a fixed packets-per-second rule can express. Restrict WHO
        # may reach it instead: --allow-cidr, or drop this line and firewall the
        # port to your buddies.
        udp dport $port_relay accept

        # Everything else that is part of an existing conversation.
        ct state established,related accept

        # ICMP / ICMPv6 (needed for PMTU discovery and basic diagnostics).
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Management.
        tcp dport $port_ssh accept

        # Everything else is dropped by the chain policy.
    }

    chain forward { type filter hook forward priority filter; policy drop; }
    chain output  { type filter hook output  priority filter; policy accept; }
}
