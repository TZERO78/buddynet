name: release

# Cross-compile the single buddynet binary for every target, sign each artifact
# (keyless cosign / Sigstore), attach an SBOM, and publish the GitHub release.
# Triggered by pushing a v* tag.
on:
  push:
    tags: ["v*"]

# Least privilege per job: the build job needs OIDC (id-token) for keyless
# signing but not write; only the publish job writes the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # keyless cosign signing via the GitHub OIDC token
      attestations: write    # persist the SLSA build provenance attestation
      # NOT artifact-metadata: write. actions/attest only needs that to create a
      # storage record, which requires push-to-registry — this job attests files,
      # not an OCI image, so the permission would be unused breadth.

    strategy:
      matrix:
        # BuddyNet is a Linux tool — the data plane (kernel WireGuard, nftables
        # scoping, netlink VIP bind) and deployment (systemd, Unraid) are all
        # Linux-only, so only Linux binaries are shipped. Keep this in sync with the
        # cross-compile guard in ci.yml.
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }   # Raspberry Pi, Unraid
    steps:
      # No job in this repo pushes with git, so the checkout credential has no
      # reason to stay behind in .git/config, where a later step — or anything that
      # packages the workspace — could carry it out of the job. (zizmor: artipacked)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The RELEASE build takes no build cache. A cache is restored from the
      # default-branch scope, which every push to main writes; so a poisoned entry
      # placed there would be linked into the binaries this job then signs and
      # attests — and neither control would notice. A cosign signature and a SLSA
      # provenance attest WHO built and FROM WHICH ref; neither attests that the
      # build inputs were clean. Without this, "can land a commit on main" becomes
      # "can put bytes in a signed release" with nothing in the source tree to show
      # for it. ci.yml may keep its cache: it signs nothing. (zizmor: cache-poisoning)
      #
      # The cost is one cold compile of a small tree, twice a month.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # A-07's gate. The point of the pin is that the stdlib govulncheck scans is
      # the stdlib that ships — and "setup-go honours the toolchain line" did NOT
      # hold here: with go-version-file it installed the `go` line (1.25.0), so
      # the CVE scan ran against go1.25 while the release builds with the version
      # on the `toolchain` line.
      # The finding, reproduced by the first attempt at fixing it.
      #
      # So the toolchain directive is left to the go command (GOTOOLCHAIN=auto
      # switches to EXACTLY the pinned version when the installed one is older),
      # and this step asserts the result instead of trusting it.
      - name: toolchain is the pinned one
        run: |
          want=$(awk '/^toolchain /{print $2}' go.mod)
          got=$(go version | awk '{print $3}')
          echo "go.mod pins $want; this job runs $got"
          if [ "$want" != "$got" ]; then
            echo "::error::CI builds with $got but go.mod pins $want — everything below would test a different stdlib than the release"
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: build, checksum and sign
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          # Two binaries: the full multi-role `buddynet`, and the single-purpose
          # `buddynet-handshake` for a stateless public matchmaker. Both are built,
          # checksummed, and keyless-signed the same way.
          for cmd in buddynet buddynet-handshake; do
            out="${cmd}-${GOOS}-${GOARCH}"
            # -s -w strips symbol/debug info to keep the binary small; -trimpath
            # makes the build reproducible.
            go build -trimpath -ldflags="-s -w -X main.version=${version}" \
              -o "dist/${out}" "./cmd/${cmd}"
            ( cd dist && sha256sum "${out}" > "${out}.sha256" )
            # Keyless Sigstore bundle (signature + cert + transparency-log proof in
            # one file, cosign v4's default format), verifiable with:
            #   cosign verify-blob --bundle <out>.bundle \
            #     --certificate-identity-regexp '^https://github\.com/TZERO78/buddynet/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <out>
            cosign sign-blob --yes --bundle "dist/${out}.bundle" "dist/${out}"
          done

      # SLSA build provenance, on top of the cosign bundles above. The two answer
      # different questions: the cosign bundle proves "this file was signed by
      # this workflow" and verifies offline from the .bundle next to the binary;
      # the attestation proves "this file came out of THIS source at THIS commit,
      # built by THIS workflow" and needs no extra file — GitHub stores it, and
      # `gh attestation verify <file> --repo TZERO78/buddynet` fetches it.
      #
      # Only the two binaries are subjects. The .sha256 and .bundle files next to
      # them are checksums and signatures OF those binaries; attesting them as
      # artifacts in their own right would be noise.
      - name: attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/buddynet-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/buddynet-handshake-${{ matrix.goos }}-${{ matrix.goarch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buddynet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      # No job in this repo pushes with git, so the checkout credential has no
      # reason to stay behind in .git/config, where a later step — or anything that
      # packages the workspace — could carry it out of the job. (zizmor: artipacked)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Software Bill of Materials for the module graph, attached to the release.
      - name: generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/buddynet-${{ github.ref_name }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          # A SemVer pre-release tag (v1.2.3-rc1, -beta, …) carries a hyphen; mark
          # it prerelease explicitly so it never becomes "latest". Don't rely on
          # the action's auto-detection — it did not fire for v1.0.1-rc1.
          prerelease: ${{ contains(github.ref_name, '-') }}
