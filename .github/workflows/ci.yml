name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Never fetch a toolchain: setup-go installs exactly the one go.mod names
# (`toolchain go1.26.6`), and `local` makes any attempt to use another one an
# error instead of a silent download. Without this the `toolchain` line is only a
# minimum and a newer installed toolchain wins — which is how the released binary
# and the CVE scan ended up on different stdlibs (A-07).
env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./...

      - name: build
        run: go build ./...

      # The shipped systemd units, validated by systemd itself. The binaries are
      # installed first so ExecStart resolves — without that systemd-analyze
      # exits 1 on "command is not executable" and the check would be noise.
      #
      # To be honest about what this covers: systemd-analyze verify checks the
      # UNIT, not whether the binary accepts the flags in ExecStart. It would NOT
      # have caught A-05 (a unit passing a removed flag). The flag-drift test in
      # cmd/buddynet{,-handshake} is that gate; this is the complement that
      # catches unit syntax the Go test cannot see.
      - name: systemd units
        run: |
          go build -o /tmp/buddynet ./cmd/buddynet
          go build -o /tmp/buddynet-handshake ./cmd/buddynet-handshake
          sudo install -m 0755 /tmp/buddynet /tmp/buddynet-handshake /usr/local/bin/
          systemd-analyze verify deployments/systemd/*.service
          # Sandbox scoring: informative only. The score moves with the systemd
          # version, so making it blocking would flap on every runner update.
          for u in deployments/systemd/*.service; do
            systemd-analyze security --no-pager "$u" 2>&1 | tail -3 || true
          done

      # Cross-compile every shipped release target so an arch-specific break fails
      # CI here, not in the tag-triggered release build. Keep in sync with the
      # matrix in .github/workflows/release.yml (Linux only, by design).
      - name: cross-compile (release targets)
        run: |
          for t in linux/amd64 linux/arm64; do
            for c in ./cmd/buddynet ./cmd/buddynet-handshake; do
              echo "building $c for $t"
              GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null "$c"
            done
          done

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Known CVEs in our dependencies AND in the Go toolchain, filtered to the
      # code paths we actually call. High signal, low noise — blocking.
      # Pinned to an exact version (not @latest): a security tool runs in CI with
      # repo/token access, so an upstream compromise or a bad release must not be
      # pulled automatically. The version is verified against the Go checksum
      # database on install; bump it deliberately. (Matches how the Actions and
      # Docker base image are pinned by digest elsewhere.)
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      # Static security analysis. Several rules are excluded because they fire
      # only as false positives on this codebase (see the comment at each site):
      #   G402 InsecureSkipVerify — intentional: PKI-free, identity is pinned by
      #        key in VerifyPeerCertificate (internal/tunnel/{quic,control}.go).
      #   G117 "struct field matches secret pattern" on JSON marshaling — that IS
      #        the wire protocol (SessionToken etc.); marshaling it is the point.
      #   G115 int64->uint64 of a positive cookie epoch — provably non-negative.
      #   G104 unchecked best-effort writes (conn.WriteToUDP), G304 file opens from
      #        config-supplied paths — pervasive in net/CLI code, not vulnerabilities.
      # Every other rule (exec, SQL, weak crypto, etc.) stays blocking. Installed
      # and run with the runner's Go (setup-go above), not the dockerized action —
      # that image bundles an older Go that GOTOOLCHAIN=local rejects against our
      # go.mod (go >= 1.25).
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          gosec -severity medium -exclude=G104,G115,G117,G304,G402 ./...
